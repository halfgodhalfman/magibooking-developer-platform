[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "magibooking"
version = "0.2.0.dev1"
description = "Server-side MagiBooking cloud API client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["magibooking*"]
