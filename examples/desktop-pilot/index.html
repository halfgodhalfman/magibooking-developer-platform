<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MagiBooking 桌面测试入口</title><link rel="stylesheet" href="/style.css"><main><p>MAGIBOOKING DEVELOPER PLATFORM · STAGING</p><h1>MagiBooking 测试接入</h1><p>仅连接 staging 的 Developer sandbox；不收费、不发送真实邮件或短信。</p><button id="connect" type="button" disabled>连接我的测试门店</button><button id="disconnect">断开当前连接</button><p id="connection">正在检查连接…</p><button id="events">查看预约事件通知</button><p>预约事件由 staging 后台自动投递，失败会自动重试；相同事件只保存一次。请按预约编号确认对应事件。</p><pre id="event-log"></pre><p>预约全部使用测试资料，不接入真实顾客和付款。</p><form id="availability"><label>服务<select id="service" required></select></label><label>工作人员<select id="staff" required></select></label><label>日期<input id="date" type="date" required></label><button>查询可预约时间</button></form><label>可预约时间<select id="slot"></select></label><div class="actions"><button id="create" disabled>创建测试预约</button><button id="reschedule" disabled>改期至所选时间</button><button id="cancel" disabled>取消测试预约</button></div><button id="new-test" disabled>再做一次测试</button><button id="retry" disabled>重试上次未确认的操作</button><p id="status" role="status">请先连接测试门店。</p><p id="appointment"></p><p>遇到网络中断时，请先确认原预约结果；重试按钮会使用原操作，避免重复预约。</p></main><script type="module" src="/app.mjs"></script></html>
